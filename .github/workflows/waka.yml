name: Waka Readme

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TIME_RANGE: "last_7_days"
          
          # ---- 核心显示项 ----
          SHOW_LANGUAGE_PER_REPO: "True"    
          SHOW_LANGUAGE: "True"            
          SHOW_PROJECTS: "True"            
          SHOW_TOTAL_CODE_TIME: "True"       
          
          # ---- 关闭不需要的 ----
          SHOW_OS: "False"                   # 关闭操作系统
          SHOW_EDITORS: "False"              # 关闭编辑器
          SHOW_COMMIT: "False"               # 关闭提交热力图
          SHOW_DAYS_OF_WEEK: "False"         # 关闭活跃日
          SHOW_LOC_CHART: "False"            # 关闭代码行数图表
          SHOW_PROFILE_VIEWS: "False"        # 关闭浏览量
          SHOW_SHORT_INFO: "False"           # 关闭趣味小知识
          SHOW_TIMEZONE: "False"             # 关闭时区
          SHOW_LINES_OF_CODE: "False"        # 关闭代码总行数
          
          # ---- 视觉风格 ----
          LOCALE: "zh"                       # 简体中文
          SYMBOL_VERSION: "2"                # 方块进度条
          BADGE_STYLE: "flat"                # 徽章样式
          
          # ---- 提交设置 ----
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "chore: update waka stats"
