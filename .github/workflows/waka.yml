name: Waka Readme

on:
  schedule:
    # 每天 UTC 18:30 运行（北京时间次日凌晨 02:30）
    - cron: '30 18 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # ---- 显示开关 ----
          SHOW_OS: "True"                   # 显示使用的操作系统
          SHOW_EDITORS: "True"              # 显示使用的编辑器/IDE
          SHOW_LANGUAGE: "True"             # 显示编码语言分布
          SHOW_COMMIT: "True"               # 显示提交活动图
          SHOW_TIMEZONE: "True"             # 显示时区
          SHOW_UPDATED_DATE: "True"         # 显示最后更新时间

          # ---- 视觉风格 ----
          LOCALE: "zh"                      # 显示语言，简体中文
          SYMBOL_VERSION: "2"               # 进度条样式，'2' 为方块样式[citation:2]
          BADGE_STYLE: "flat"               # 徽章样式，可选 flat-square, plastic, for-the-badge[citation:6]

          # ---- 提交与仓库设置 ----
          COMMIT_BY_ME: "False"             # 是否使用你的身份提交，'False' 则使用 readme-bot[citation:2]
          COMMIT_MESSAGE: "chore: update waka stats"  # 自定义提交信息
          IGNORED_REPOS: ""                 # 忽略统计的仓库，多个用逗号分隔

          # ---- SVG 进度条美化 (可选) ----
          # 从 Unicode 进度条切换到更漂亮的彩色 SVG 进度条[citation:11][citation:3]
          # BAR_STYLE: "svg"
          # BAR_COLOR: "#90CAF9"            # 进度条颜色 (浅蓝)
          # BAR_TRACK_COLOR: "#172f45"       # 进度条背景色 (深蓝)
          # BAR_RADIUS: "4"                  # 进度条圆角
          # TEXT_PRIMARY_COLOR: "#c9d1d9"    # 主文本颜色
          # TEXT_SECONDARY_COLOR: "#8b949e"  # 次要文本颜色
